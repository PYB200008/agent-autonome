# Nginx configuration shared by Site A and Site B.
# Serves static files from the default html directory.
# Optimized for local development and Kubernetes lab environments.

server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # --- Charset ---------------------------------------------------- #
    charset utf-8;

    # --- Logging (stdout/stderr for Docker) ------------------------- #
    access_log /dev/stdout;
    error_log  /dev/stderr;

    # --- Gzip compression ------------------------------------------- #
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # --- Cache headers (disabled for development) ------------------- #
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma        "no-cache";
    add_header Expires       "0";

    # --- Static files ----------------------------------------------- #
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Favicon (avoid 404 noise in logs) -------------------------- #
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }
}
