# Shared nginx configuration for both Site A and Site B.
# Mounted as a volume into each Deployment pod.

apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: default
data:
  default.conf: |
    server {
        listen       8080;
        server_name  _;

        root   /usr/share/nginx/html;
        index  index.html;

        charset utf-8;

        access_log /dev/stdout;
        error_log  /dev/stderr;

        gzip on;
        gzip_vary on;
        gzip_min_length 256;
        gzip_types
            text/plain
            text/css
            text/javascript
            text/xml
            application/javascript
            application/json
            application/xml
            image/svg+xml;

        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma        "no-cache";
        add_header Expires       "0";

        location / {
            try_files $uri $uri/ /index.html;
        }

        location = /favicon.ico {
            log_not_found off;
            access_log off;
        }
    }
